Kidney:
  # (PT, TAL)
  rna: data/Kidney/Kidney.rna.rds
  atac: data/Kidney/Kidney.atac_pc.rds
  fragments:
    - data/Kidney/raw/GSE254185_Library1_atac_fragments.tsv.gz
    - data/Kidney/raw/GSE254185_Library2_atac_fragments.tsv.gz
    - data/Kidney/raw/GSE254185_Library3_atac_fragments.tsv.gz
    - data/Kidney/raw/GSE254185_Library4_atac_fragments.tsv.gz
    - data/Kidney/raw/GSE254185_Library5_atac_fragments.tsv.gz
    - data/Kidney/raw/GSE254185_Library6_atac_fragments.tsv.gz
  # Metadata cell IDs use l1_, ..., l6_; these names are paired with the
  # six Library1, ..., Library6 fragment files above.
  archr_sample_name:
    - l1
    - l2
    - l3
    - l4
    - l5
    - l6
  metadata: data/Kidney/Kidney.meta.rds
  candidate_pairs: data/Kidney/Kidney.gene_peak_df_pc.rds
  celltype_column: newCT
  covariates:
    - log(nCount_RNA)
    - condition
  subset_covariates:
    - log(nCount_RNA)
  batch_column: donor
  diff_condition_column: condition
  # Calibre uses the first level as reference and the second as comparison.
  diff_reference_condition: Control
  diff_comparison_condition: UUO
  diff_donor_column: donor
  diff_covariates:
    - log(nCount_RNA)
  output_dir: results/Kidney
  benchmark_output_dir: results/real/Kidney
  genome: hg38
  conservative: false
  crispr_reference_build: hg38
  crispr_positive: reference/CRISPR/crispr_hg38_positive.tsv
  crispr_negative: reference/CRISPR/crispr_hg38_negative.tsv

