defaults:
  family: poisson
  null_generation: s
  statistic: zval
  fdr: 0.10
  correction: false
  conservative: false
  seed: 20260818
  n_cores: 32
  celltype_column: newCT
  selection: rate
  binarize_atac: true
  scmultimap_irls: true

pbmc:
  rna: data/pbmc/pbmc_multimodal.rna.rds
  atac: data/pbmc/pbmc_multimodal.atac_pc.rds
  fragments: data/pbmc/pbmc_granulocyte_sorted_10k_atac_fragments.tsv.gz
  archr_sample_name: pbmc
  metadata: data/pbmc/pbmc_multimodal.meta.rds
  candidate_pairs: data/pbmc/pbmc_gene_peak_df.rds
  celltype_column: newCT
  batch_column: null
  covariates:
    - log(nCount_RNA)
  output_dir: results/pbmc
  benchmark_output_dir: results/real/pbmc
  genome: hg38
  conservative: false
  crispr_reference_build: hg38
  crispr_positive: reference/CRISPR/crispr_hg38_positive.tsv
  crispr_negative: reference/CRISPR/crispr_hg38_negative.tsv

